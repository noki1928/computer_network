events {
    worker_connections  2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;

    geo $ru_ip {
        default 0;

        5.3.0.0/16 1;
        5.18.0.0/15 1;
        213.248.0.0/14 1;

        84.237.0.0/16 1;
    }

    server {
        listen 80;
        server_name localhost _;

        location = /ru-blocked.html {
            internal;
            default_type text/html;
            return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Доступ запрещён</title></head><body style="font-family: Arial, sans-serif; text-align: center; padding: 50px;"><h1 style="color: #c00;">ВАМ СЮДА НЕЛЬЗЯ</h1><p>Доступ с вашего IP-адреса ограничен.</p></body></html>';
        }

        location / {
            if ($ru_ip) {
                return 403;
            }

            proxy_pass http://127.0.0.1:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        error_page 403 = @ru_forbidden;

        location @ru_forbidden {
            rewrite ^ /ru-blocked.html last;
        }
    }
}