version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: films_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: films
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d films"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: films_parser_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: postgres
    volumes:
      - .:/app

volumes:
  postgres_data: